<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sub4Sub Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            background-color: #1e293b;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 350px;
        }
        h1 {
            color: #38bdf8;
            font-size: 24px;
            margin-bottom: 10px;
        }
        p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 20px;
        }
        button {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
        }
        button:hover {
            background-color: #0ea5e9;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Yoha Sub4Sub</h1>
        <p>እንኳን ወደ ቴሌግራም ሚኒ አፕ በደህና መጡ! 🚀</p>
        <button onclick="welcomeAction()">הጀምር / Start</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        function welcomeAction() {
            let user = tg.initDataUnsafe.user;
            let name = user ? user.first_name : "ተጠቃሚ";
            alert("ሰላም " + name + "! ሚኒ አፑ በትክክል እየሰራ ነው።");
        }
    </script>

</body>
</html>
